<!doctype html>
<html lang="en">
  <head>
    <script>
      // Prevent "Cannot set property fetch of #<Window> which has only a getter"
      // when preview instrumentation, extensions, or libraries assign to window.fetch
      (function() {
        try {
          var originalFetch = window.fetch;
          var currentFetch = originalFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return currentFetch;
            },
            set: function(fn) {
              currentFetch = fn;
            },
            configurable: true,
            enumerable: true
          });
          if (typeof Window !== 'undefined' && Window.prototype) {
            try {
              var desc = Object.getOwnPropertyDescriptor(Window.prototype, 'fetch');
              if (desc && !desc.set && desc.configurable) {
                Object.defineProperty(Window.prototype, 'fetch', {
                  get: function() {
                    return currentFetch;
                  },
                  set: function(fn) {
                    currentFetch = fn;
                  },
                  configurable: true,
                  enumerable: true
                });
              }
            } catch (e) {}
          }
        } catch (err) {
          // Non-fatal if browser sandbox prevents redefinition
        }
      })();
    </script>
